name: 测试方糖推送
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: 测试推送
        env:
          SCT_KEY: ${{ secrets.SCT_KEY }}
        run: |
          curl "https://sctapi.ftqq.com/${SCT_KEY}.send" \
            -d "title=测试推送" \
            -d "desp=如果收到这条消息，说明SCT_KEY配置完全正常！"
