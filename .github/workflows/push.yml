name: 基金每日推送
on:
  workflow_dispatch:
  schedule:
    - cron: '0 1 * * *'
    - cron: '0 6 * * *'

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - name: 推送基金数据
        env:
          SCT_KEY: ${{ secrets.SCT_KEY }}
        run: |
          # 发送推送
          curl -s "https://sctapi.ftqq.com/${SCT_KEY}.send" \
            -d "title=基金每日分析报告" \
