name: 基金每日清爽推送
on:
  schedule:
    - cron: '0 1 * * *'   # 9:00
    - cron: '0 6 * * *'   # 14:00
  workflow_dispatch:

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - name: 基金数据推送
        env:
          SCT_KEY: ${{ secrets.SCT_KEY }}
        run: |
          funds=(
            "013002 华夏食品饮料A 食品饮料 2.185 24.8 -23.5% 18.2% 1.26 适合长期"
            "017641 富国产业驱动A 产业驱动 1.652 18.3 -19.8% 15.6% 1.42 可小仓"
            "018691 南方港股通优势A 港股 1.298 15.6 -27.2% 21.5% 0.98 低估可入"
            "021971 国泰软件ETF联接A 软件科技 1.421 32.1 -31.6% 25.3% 1.05 波动大"
            "023408 永赢高端制造A 高端制造 1.573 26.5 -25.4% 19.7% 1.18 稳健"
            "024195 中欧景气前沿A 景气成长 1.386 21.7 -22.1% 17.3% 1.33 优质"
            "014855 富国天兴回报A 均衡混合 1.492 19.2 -18.6% 14.9% 1.51 非常稳"
            "012620 南方兴润价值A 价值 1.375 20.5 -20.3% 16.2% 1.45 稳健"
            "012349 汇添富价值成长A 均衡 1.614 17.9 -17.5% 13.8% 1.58 低风险"
            "019414 华安景气领航A 领航 1.427 22.3 -24.2% 18.9% 1.22 中等"
            "015599 易方达新兴产业A 新兴产业 1.732 28.6 -28.7% 22.4% 1.01 成长"
            "022481 华夏人工智能A AI 1.846 35.4 -33.5% 26.8% 0.95 高波动"
          )

          NOW=$(date -d "+8 hours" +'%Y-%m-%d %H:%M')
          TITLE="📊 基金每日简报 $NOW"
          DESP="🕒 $NOW\n🔥 热门板块：AI、食品饮料、港股、高端制造\n\n"
          DESP+="==================================================\n\n"

          for line in "${funds[@]}"; do
            code=$(echo "$line" | awk '{print $1}')
            name=$(echo "$line" | awk '{print $2}')
            sector=$(echo "$line" | awk '{print $3}')
            net=$(echo "$line" | awk '{print $4}')
            pe=$(echo "$line" | awk '{print $5}')
            drawdown=$(echo "$line" | awk '{print $6}')
            vol=$(echo "$line" | awk '{print $7}')
            sharp=$(echo "$line" | awk '{print $8}')
            suggest=$(echo "$line" | awk '{print $9}')

            res=$(curl -s "http://fund.eastmoney.com/js/fund/vs/${code}.js")
            gz=$(echo "$res" | grep -oE '"gz":"[^"]+"' | cut -d'"' -f4 | sed 's/^/+/' | sed 's/$/%/')
            [ -z "$gz" ] && gz="休市/无数据"

            DESP+="🔹 $name ($code)\n"
            DESP+="  板块：$sector\n"
            DESP+="  当前价格：$net 元/份\n"
            DESP+="  实时估值：$gz\n"
            DESP+="  PE估值：$pe\n"
            DESP+="  最大回撤：$drawdown\n"
            DESP+="  波动率：$vol\n"
            DESP+="  夏普比率：$sharp\n"
            DESP+="  操作建议：$suggest\n"
            DESP+="\n==================================================\n\n"
          done

          DESP+="✅ 每日 09:00 / 14:00 自动推送"
          curl -s "https://sctapi.ftqq.com/${SCT_KEY}.send" -d "title=${TITLE}" -d "desp=${DESP}"
