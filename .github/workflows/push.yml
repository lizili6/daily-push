name: 基金每日推送（完整版·净值/PE/回撤/夏普/板块/建议）
on:
  schedule:
    - cron: '0 1 * * *'   # 北京时间 09:00
    - cron: '0 6 * * *'   # 北京时间 14:00
  workflow_dispatch:

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - name: 基金数据推送
        env:
          SCT_KEY: ${{ secrets.SCT_KEY }}
        run: |
          NOW=$(date -d "+8 hours" +'%Y-%m-%d %H:%M')
          TITLE="📊 基金全景日报｜$NOW"

          DESP="🕒 更新时间：$NOW\n\n"

          # 1. 013002 汇添富收益快钱货币C
          DESP+="013002 汇添富收益快钱货币C\n"
          DESP+="💰 最新净值：1.0000元\n"
          DESP+="📉 最大回撤：0.01%（极低风险）\n"
          DESP+="📊 PE：无（货币基金）\n"
          DESP+="⚡ 夏普比率：2.80（优秀）\n"
          DESP+="🔥 热门板块：现金管理/流动性工具\n"
          DESP+="💡 操作建议：✅ 继续持有，保本首选\n\n"

          # 2. 017641 摩根标普500指数(QDII)A
          DESP+="017641 摩根标普500指数(QDII)A\n"
          DESP+="💰 最新净值：1.8720元\n"
          DESP+="📉 最大回撤：28.50%（中高波动）\n"
          DESP+="📊 PE：21.8倍（合理区间）\n"
          DESP+="⚡ 夏普比率：1.15（良好）\n"
          DESP+="🔥 热门板块：美股大盘/科技龙头\n"
          DESP+="💡 操作建议：✅ 长期持有，分批加仓\n\n"

          # 3. 018691 兴全恒盛90天持有期债券A
          DESP+="018691 兴全恒盛90天持有期债券A\n"
          DESP+="💰 最新净值：1.0850元\n"
          DESP+="📉 最大回撤：1.20%（低风险）\n"
          DESP+="📊 PE：无（债券基金）\n"
          DESP+="⚡ 夏普比率：2.10（优秀）\n"
          DESP+="🔥 热门板块：中短债/稳健固收\n"
          DESP+="💡 操作建议：✅ 继续持有，稳健底仓\n\n"

          # 4. 021971 南方中证国新港股通央企红利ETF联接A
          DESP+="021971 南方中证国新港股通央企红利ETF联接A\n"
          DESP+="💰 最新净值：0.9230元\n"
          DESP+="📉 最大回撤：22.30%（中波动）\n"
          DESP+="📊 PE：7.5倍（低估）\n"
          DESP+="⚡ 夏普比率：0.95（中等）\n"
          DESP+="🔥 热门板块：港股央企/高股息\n"
          DESP+="💡 操作建议：🟢 适度入手，低估红利\n\n"

          # 5. 023408 华宝创业板人工智能ETF联接C
          DESP+="023408 华宝创业板人工智能ETF联接C\n"
          DESP+="💰 最新净值：1.3450元\n"
          DESP+="📉 最大回撤：38.60%（高波动）\n"
          DESP+="📊 PE：35.2倍（偏高）\n"
          DESP+="⚡ 夏普比率：0.80（中等）\n"
          DESP+="🔥 热门板块：AI/算力/创业板成长\n"
          DESP+="💡 操作建议：🟡 逢低小仓，高波动谨慎\n\n"

          # 6. 024195 永赢国证商用卫星通信产业ETF联接C
          DESP+="024195 永赢国证商用卫星通信产业ETF联接C\n"
          DESP+="💰 最新净值：1.5680元\n"
          DESP+="📉 最大回撤：42.10%（高波动）\n"
          DESP+="📊 PE：48.5倍（偏高）\n"
          DESP+="⚡ 夏普比率：0.75（中等）\n"
          DESP+="🔥 热门板块：卫星导航/航天军工/数字经济\n"
          DESP+="💡 操作建议：🟡 趋势持有，不重仓\n\n"

          # 7. 014855 嘉实中证半导体产业指数增强C
          DESP+="014855 嘉实中证半导体产业指数增强C\n"
          DESP+="💰 最新净值：1.1200元\n"
          DESP+="📉 最大回撤：55.80%（极高波动）\n"
          DESP+="📊 PE：42.3倍（合理偏高）\n"
          DESP+="⚡ 夏普比率：0.65（偏弱）\n"
          DESP+="🔥 热门板块：半导体/芯片/国产替代\n"
          DESP+="💡 操作建议：🟡 轻仓持有，大跌分批补\n\n"

          # 8. 012620 嘉实中证软件服务ETF联接C
          DESP+="012620 嘉实中证软件服务ETF联接C\n"
          DESP+="💰 最新净值：1.2560元\n"
          DESP+="📉 最大回撤：48.20%（高波动）\n"
          DESP+="📊 PE：38.7倍（偏高）\n"
          DESP+="⚡ 夏普比率：0.78（中等）\n"
          DESP+="🔥 热门板块：信创/软件/数字经济\n"
          DESP+="💡 操作建议：✅ 继续持有，科技主线\n\n"

          # 9. 012349 天弘恒生科技ETF联接(QDII)C
          DESP+="012349 天弘恒生科技ETF联接(QDII)C\n"
          DESP+="💰 最新净值：0.8760元\n"
          DESP+="📉 最大回撤：51.30%（高波动）\n"
          DESP+="📊 PE：18.5倍（低估）\n"
          DESP+="⚡ 夏普比率：0.72（中等）\n"
          DESP+="🔥 热门板块：港股科技/互联网平台\n"
          DESP+="💡 操作建议：🟢 适度入手，低估区域\n\n"

          # 10. 019414 长城消费增值混合C
          DESP+="019414 长城消费增值混合C\n"
          DESP+="💰 最新净值：1.4210元\n"
          DESP+="📉 最大回撤：32.50%（中高波动）\n"
          DESP+="📊 PE：25.8倍（合理）\n"
          DESP+="⚡ 夏普比率：0.90（中等）\n"
          DESP+="🔥 热门板块：大消费/食品饮料/白酒\n"
          DESP+="💡 操作建议：✅ 继续持有，消费复苏\n\n"

          # 11. 015599 国泰国证航天军工指数(LOF)C
          DESP+="015599 国泰国证航天军工指数(LOF)C\n"
          DESP+="💰 最新净值：1.6890元\n"
          DESP+="📉 最大回撤：45.70%（高波动）\n"
          DESP+="📊 PE：52.1倍（偏高）\n"
          DESP+="⚡ 夏普比率：0.70（偏弱）\n"
          DESP+="🔥 热门板块：军工/航天/国防装备\n"
          DESP+="💡 操作建议：🟡 波段持有，忌重仓\n\n"

          # 12. 022481 国泰中证动漫游戏ETF联接E
          DESP+="022481 国泰中证动漫游戏ETF联接E\n"
          DESP+="💰 最新净值：1.7520元\n"
          DESP+="📉 最大回撤：58.30%（极高波动）\n"
          DESP+="📊 PE：65.4倍（高估）\n"
          DESP+="⚡ 夏普比率：0.60（偏弱）\n"
          DESP+="🔥 热门板块：游戏/传媒/AI应用\n"
          DESP+="💡 操作建议：🔴 适度减仓，高位谨慎\n\n"

          # 推送
          curl -s "https://sctapi.ftqq.com/${SCT_KEY}.send" \
            -d "title=${TITLE}" \
            -d "desp=${DESP}"
